services:
  - type: web
    name: django-final
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn django_final.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: your-render-domain.onrender.com
      - key: SECRET_KEY
        generateValue: true
