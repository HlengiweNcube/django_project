{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2>
            Update Profile
        </h2>

        <form method="POST">

            {% csrf_token %}

            <h5 class="mt-3">Account Details</h5>
            {{ form.as_p }}

            <h5 class="mt-4">Contact Details</h5>
            {{ contact_form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
