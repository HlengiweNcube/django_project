{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h1>
            Welcome {{ request.user.username }}
        </h1>

        <p>
            You are successfully logged in.
        </p>

        <hr>

        <div class="row">

            <div class="col-md-4">

                <div class="card bg-primary text-white mb-3">

                    <div class="card-body">

                        <h5>Total Products</h5>

                        <h2>{{ total_products }}</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card bg-success text-white mb-3">

                    <div class="card-body">

                        <h5>Total Imports</h5>

                        <h2>{{ total_imports }}</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card bg-warning text-dark mb-3">

                    <div class="card-body">

                        <h5>Total Exports</h5>

                        <h2>{{ total_exports }}</h2>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
