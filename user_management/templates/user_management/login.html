{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">
                    Login
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Login
                    </button>

                </form>

                <hr>

                <p>
                    Don't have an account?
                    <a href="/register/">
                        Register Here
                    </a>
                </p>

                <p>
                    <a href="/password-reset/">
                        Forgot Password?
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
