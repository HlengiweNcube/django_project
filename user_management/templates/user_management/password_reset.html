{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2>
            Password Reset
        </h2>

        <p>
            Enter your email address to receive a password reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Send Reset Link
            </button>

        </form>

    </div>

</div>

{% endblock %}
